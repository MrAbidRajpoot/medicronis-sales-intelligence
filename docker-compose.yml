services:
  postgres:
    image: postgres:16-alpine
    container_name: medicronis-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: medicronis
      POSTGRES_PASSWORD: medicronis
      POSTGRES_DB: medicronis
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medicronis -d medicronis"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
